<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title>SheFooty+ Premium Logo</title>
<desc>Premium metallic ST monogram and neon lime plus on a carbon-textured rounded square.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#19232D"/>
    <stop offset=".52" stop-color="#0A0D10"/>
    <stop offset="1" stop-color="#151A20"/>
  </linearGradient>
  <pattern id="carbon" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="22" height="22" fill="transparent"/>
    <rect width="11" height="22" fill="#FFFFFF" opacity=".035"/>
    <rect x="11" width="5.5" height="22" fill="#FFFFFF" opacity=".018"/>
  </pattern>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".18" stop-color="#BFC6CC"/>
    <stop offset=".42" stop-color="#F8F9FA"/>
    <stop offset=".68" stop-color="#9BA3AA"/>
    <stop offset="1" stop-color="#E9ECEF"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity=".55"/>
  </filter>
  <filter id="neon" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="14" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="72" y="72" width="880" height="880" rx="180" fill="url(#bg)"/>
<rect x="72" y="72" width="880" height="880" rx="180" fill="url(#carbon)"/>
<g filter="url(#shadow)" fill="url(#metal)" stroke="#6E767D" stroke-width="3" stroke-linejoin="round">
  <path d="M278 286
           C220 286 186 325 186 379
           C186 434 222 470 278 470
           H430
           L378 560
           L324 486
           H266
           L379 652
           L516 414
           H284
           C252 414 234 398 234 377
           C234 354 251 340 284 340
           H757
           L786 286
           Z"/>
  <path d="M571 414
           H704
           L675 468
           H619
           L461 760
           L417 708
           Z"/>
</g>
<g filter="url(#neon)" fill="#B9FF00" stroke="#E8FFB0" stroke-width="6">
  <rect x="716" y="514" width="52" height="190" rx="18"/>
  <rect x="647" y="583" width="190" height="52" rx="18"/>
</g>
</svg>
